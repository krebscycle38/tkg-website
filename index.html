<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Krebs Group LLC</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28' font-family='serif' fill='%231a2744'>K</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy: #1a2744;
    --red: #8b2e2e;
    --slate: #7c8a9c;
    --light-slate: #b0bcc9;
    --bg: #f8f7f4;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--navy);
  }
  .container {
    text-align: center;
    padding: 40px 24px;
    max-width: 520px;
  }
  .the {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 2px;
  }
  .name {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--navy);
  }
  .rule {
    width: 36px;
    height: 2px;
    background: linear-gradient(to right, var(--navy), var(--red), var(--light-slate));
    margin: 32px auto;
    border-radius: 1px;
  }
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 400;
    color: rgba(26,39,68,0.65);
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="the">The</div>
    <div class="name">Krebs Group</div>
    <div class="rule"></div>
    <div class="tagline">Plain talk. Hard problems.</div>
  </div>
</body>
</html>
